
name: Daily Stock Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1-5'
    - cron: '30 8 * * 1-5'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run scan
        env:
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/scan.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/latest.json data/signal_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily scan data"
            git push
          fi

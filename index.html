<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f9">
<title>혀누 주식 스크리너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="brand-logo" aria-hidden="true">혀</div>
    <div>
      <h1>혀누 주식 스크리너</h1>
      <span id="updated" class="muted">데이터 확인 중</span>
    </div>
  </div>
  <button type="button" id="refreshData" class="refresh-button" aria-label="데이터 새로고침">↻ 새로고침</button>
</header>
<nav class="tabs">
  <button type="button" class="tab active" data-page="macro">시장 요약</button>
  <button type="button" class="tab" data-page="scanner">신호 스캐너</button>
  <button type="button" class="tab" data-page="detail">종목 상세</button>
  <button type="button" class="tab" data-page="history">이력·성과</button>
</nav>
<main>
<section class="page active" id="page-macro">
  <div id="macroMetrics"></div>
</section>
<section class="page" id="page-scanner">
  <div class="toolbar">
    <input id="search" type="search" placeholder="티커 또는 회사명 검색">
    <select id="signalFilter">
      <option value="all">모든 신호</option>
      <option value="패닉셀">패닉셀</option>
      <option value="급락">급락</option>
      <option value="조정">조정</option>
      <option value="단기조정">단기조정</option>
    </select>
    <select id="sort">
      <option value="strength">신호 강도순</option>
      <option value="ticker">티커순</option>
      <option value="drop">고점 대비 하락률순</option>
    </select>
  </div>
  <div id="scannerStatus" class="notice">데이터 확인 중</div>
  <div id="signalList" class="signal-list"></div>
</section>
<section class="page" id="page-detail">
  <div id="detailBody"><div class="panel">스캐너에서 종목을 선택하세요.</div></div>
</section>
<section class="page" id="page-history">
  <h3 class="mc-title"><span>승률 · 수익률</span><i></i><em>다음날 시가 진입 · 수익률 + = 승</em></h3>
  <div id="performanceSummary" class="hist-grid"></div>
  <h3 class="mc-title"><span>최근 신호 기록</span><i></i><em id="historyMeta"></em></h3>
  <div id="historyList">이력 불러오는 중</div>
</section>
</main>
<footer>분석 참고용 도구입니다. 투자 판단은 사용자 책임입니다.</footer>
<script src="app.js"></script>
</body>
</html>
